version: 2
updates:
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 1
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 does not ship the compiler API that the tsup dts build uses.
      - dependency-name: typescript
        versions: ['>=7.0.0']
      # Keep Node.js types at the oldest supported runtime; @hareru/cli requires Node.js 22.12+.
      - dependency-name: '@types/node'
        versions: ['>=23.0.0']
    groups:
      # fumadocs-ui requires the exact same fumadocs-core version as a peer dependency.
      fumadocs:
        patterns: ['fumadocs-*']
      development-patches:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 1
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
