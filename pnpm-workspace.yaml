packages:
  - "packages/*"
  - "apps/*"

# Delay newly published dependencies; urgent fixes can use a reviewed exact-version exception.
minimumReleaseAge: 1440
strictDepBuilds: true
onlyBuiltDependencies:
  - esbuild
  - sharp
# Biome's postinstall only probes the optional binary; the CLI resolves it directly.
ignoredBuiltDependencies:
  - "@biomejs/biome"

# Keep Node.js types at the oldest runtime that @hareru/cli supports (Node.js 22.12+).
overrides:
  "@types/node": "^22.20.5"
